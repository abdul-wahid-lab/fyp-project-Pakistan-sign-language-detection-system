name: linguasign_mobile
description: Pakistan Sign Language recognition — offline, on-device
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.10.5+9
  tflite_flutter: ^0.10.4
  flutter_tts: ^3.8.5
  provider: ^6.1.2
  permission_handler: ^11.3.1
  image: ^4.2.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/alphabet/
    - assets/images/words/
